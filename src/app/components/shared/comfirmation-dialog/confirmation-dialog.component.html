<h2 mat-dialog-title>¿Usted está seguro?</h2>
<mat-dialog-content>
  <p>{{data.message}}</p>
</mat-dialog-content>
<mat-dialog-actions align="end">
  <button matButton mat-dialog-close>Cancelar</button>
  <button matButton [mat-dialog-close]="true" class="confirm" >{{data.action}}</button>
</mat-dialog-actions>
