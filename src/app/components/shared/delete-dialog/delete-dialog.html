<h2 mat-dialog-title>¿Usted está seguro?</h2>
<mat-dialog-content>
  <p>Por favor, confirme que desea eliminar este {{data.entity}}.</p>
</mat-dialog-content>
<mat-dialog-actions align="end">
  <button matButton mat-dialog-close>Cancelar</button>
  <button matButton [mat-dialog-close]="true" class="confirm" >Eliminar</button>
</mat-dialog-actions>
