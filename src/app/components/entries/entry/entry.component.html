@let entry = this.entry();
<div>
  <p>Fecha: {{entry.date | date}}</p>
  <h3>{{entry.title}}</h3>
  <p>{{entry.content}}</p>
</div>
<div class="menu">
    <app-button
      (mouseenter)="onEditHandler()"
      tooltip="Editar registro."
      route="/app/entries/edit/{{entry.id}}"
      icon="assets/edit.svg"
    />
    <app-button
      tooltip="Eliminar registro."
      (click)="openDeleteDialog()"
      icon="assets/delete.svg"
    />
</div>
