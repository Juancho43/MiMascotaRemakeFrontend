@if(this.journal().journal_slug!){

@let journal = this.journal();

<div class="Main">
  <app-animal-data
    [animal]="journal.animal!"
  />
  <app-animal-images
    [slug]="journal.journal_slug!"
    [animalId]="journal.animal?.id!"
  />
  <app-animal-entries
    [journalSlug]="journal.journal_slug!"
    [totalItems]="journal.entryCount!"
  />
  //TODO: Buscar alguna alternativa para el entryCount a la hora de eliminar entradas
</div>
}
