<div
  class="journal-card"
>
  <h3>{{journal().name}}</h3>
  @if (journal().path) {
    <img
      [ngSrc]=" environment.public_url+ '/'+journal().path!"
      alt="{{journal().name}} image"
      class="journal-image"
      width="167"
      height="100"
      priority
    >
<!--    TODO: ver overflow de la imagen-->
  }@else{
    <img
      ngSrc="assets/photo_upload.svg"
      alt="Add photo"
      class="journal-image"
      width="167"
      height="100"
    >
  }




</div>
