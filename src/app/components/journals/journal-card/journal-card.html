<div
  [routerLink]="['/app/journals/', journal().journal_id!, 'view']"
  class="journal-card"
>
  <h3>{{journal().name}}</h3>
  @if (journal().path) {
    <img
      [ngSrc]=" environment.public_url+ '/'+journal().path!"
      alt="{{journal().name}} image"
      class="journal-image"
      width="100"
      height="150"
    >
  }@else{
    <img
      ngSrc="assets/photo_upload.svg"
      alt="Add photo"
      class="journal-image"
      width="100"
      height="150"
    >
  }




</div>
